name: dev786-linux-qualification

on:
  push:
    branches:
      - codex/dev786-linux-qualification-20261026-01

permissions:
  contents: read

jobs:
  qualify:
    if: >-
      github.repository == 'nold-ai/.github' &&
      github.repository_id == '1110267669' &&
      github.repository_owner_id == '225190663' &&
      github.ref == 'refs/heads/codex/dev786-linux-qualification-20261026-01' &&
      github.workflow == 'dev786-linux-qualification' &&
      github.workflow_ref == 'nold-ai/.github/.github/workflows/dev786-linux-qualification.yml@refs/heads/codex/dev786-linux-qualification-20261026-01' &&
      github.event_name == 'push' && github.run_attempt == 1 &&
      github.event.created == true && github.event.deleted == false &&
      github.event.before == '0000000000000000000000000000000000000000'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Exact detached checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        timeout-minutes: 3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          lfs: false
          submodules: false

      - name: Fixed Linux qualification and bounded artifact handoff
        id: qualify
        timeout-minutes: 14
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          case "$GITHUB_RUN_ID" in ''|*[!0-9]*) exit 1;; esac
          receipt="$RUNNER_TEMP/dev786-linux-qualification-output-$GITHUB_RUN_ID-1"
          mkdir -m 700 -- "$receipt"
          set -o noclobber
          set +e
          /usr/bin/timeout --signal=TERM --kill-after=5s 800s /usr/bin/env -i \
            PATH=/usr/bin:/bin LC_ALL=C.UTF-8 HOME="$HOME" TMPDIR="$RUNNER_TEMP" \
            RUNNER_TEMP="$RUNNER_TEMP" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_REPOSITORY_ID="$GITHUB_REPOSITORY_ID" \
            GITHUB_REPOSITORY_OWNER_ID="$GITHUB_REPOSITORY_OWNER_ID" GITHUB_REF="$GITHUB_REF" \
            GITHUB_SHA="$GITHUB_SHA" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
            GITHUB_EVENT_PATH="$GITHUB_EVENT_PATH" GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_WORKFLOW="$GITHUB_WORKFLOW" \
            GITHUB_WORKFLOW_REF="$GITHUB_WORKFLOW_REF" ImageOS="$ImageOS" ImageVersion="$ImageVersion" \
            /usr/bin/python3 -I -S -B .github/development/dev786_linux_qualification/qualify.py \
            | /usr/bin/head -c 65537 > "$receipt/result.json"
          operator_status=${PIPESTATUS[0]}
          /usr/bin/timeout --signal=TERM --kill-after=2s 30s /usr/bin/env -i \
            PATH=/usr/bin:/bin LC_ALL=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_OUTPUT="$GITHUB_OUTPUT" \
            /usr/bin/python3 -I -S -B - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import stat
          import time

          deadline = time.monotonic() + 28
          owner = Path(os.environ['RUNNER_TEMP']) / ('dev786-linux-qualification-' + os.environ['GITHUB_RUN_ID'] + '-1')
          export = owner / 'export'
          result_path = Path(os.environ['RUNNER_TEMP']) / ('dev786-linux-qualification-output-' + os.environ['GITHUB_RUN_ID'] + '-1') / 'result.json'

          def attrs(s):
              return (s.st_dev, s.st_ino, s.st_mode, s.st_nlink, s.st_uid, s.st_size, s.st_mtime_ns, s.st_ctime_ns)

          def directory(path):
              assert path.is_absolute()
              fd = os.open('/', os.O_RDONLY | os.O_DIRECTORY)
              try:
                  for name in path.parts[1:]:
                      new = os.open(name, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW, dir_fd=fd)
                      os.close(fd)
                      fd = new
                  return fd
              except BaseException:
                  os.close(fd)
                  raise

          def read(fd, name, limit):
              assert time.monotonic() < deadline
              before = os.stat(name, dir_fd=fd, follow_symlinks=False)
              assert stat.S_ISREG(before.st_mode) and before.st_nlink == 1 and before.st_uid == os.getuid() and before.st_size <= limit
              child = os.open(name, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK, dir_fd=fd)
              try:
                  assert attrs(before) == attrs(os.fstat(child))
                  chunks = []
                  left = limit + 1
                  while left:
                      raw = os.read(child, min(65536, left))
                      if not raw:
                          break
                      chunks.append(raw)
                      left -= len(raw)
                  raw = b''.join(chunks)
                  assert len(raw) == before.st_size and len(raw) <= limit
                  assert attrs(before) == attrs(os.fstat(child)) == attrs(os.stat(name, dir_fd=fd, follow_symlinks=False))
                  return raw
              finally:
                  os.close(child)

          fd = directory(result_path.parent)
          try:
              result = json.loads(read(fd, result_path.name, 65536))
          finally:
              os.close(fd)
          assert set(result) == {'state', 'reasons', 'export'}
          assert result['state'] in ('FAILED', 'INCOMPLETE', 'QUALIFIED_PENDING_REVIEW')
          assert isinstance(result['reasons'], list) and all(isinstance(item, str) for item in result['reasons'])
          assert result['export'] == str(export) and '\n' not in str(export) and '\r' not in str(export)
          for path in (owner, export):
              value = path.lstat()
              assert stat.S_ISDIR(value.st_mode) and value.st_uid == os.getuid() and stat.S_IMODE(value.st_mode) == 0o700
          files = {}
          total = entries = 0

          def walk(path, prefix=''):
              global total, entries
              fd = directory(path)
              before = os.fstat(fd)
              try:
                  with os.scandir(fd) as scan:
                      names = []
                      for entry in scan:
                          entries += 1
                          assert entries <= 320
                          names.append(entry.name)
                  for name in sorted(names):
                      value = os.stat(name, dir_fd=fd, follow_symlinks=False)
                      if stat.S_ISDIR(value.st_mode):
                          walk(path / name, prefix + name + '/')
                      else:
                          assert len(files) < 128
                          raw = read(fd, name, min(67108864 - total, 2097152))
                          total += len(raw)
                          files[prefix + name] = {'bytes': len(raw), 'sha256': hashlib.sha256(raw).hexdigest()}
                  assert (before.st_dev, before.st_ino) == (path.lstat().st_dev, path.lstat().st_ino)
              finally:
                  os.close(fd)

          walk(export)
          fd = directory(export / 'meta')
          try:
              assert json.loads(read(fd, 'result.json', 65536)) == result
              inventory = json.loads(read(fd, 'files.json', 131072))
              assert inventory == {name: identity for name, identity in files.items() if name != 'meta/files.json'}
          finally:
              os.close(fd)
          output = Path(os.environ['GITHUB_OUTPUT'])
          fd = directory(output.parent)
          try:
              before = os.stat(output.name, dir_fd=fd, follow_symlinks=False)
              assert stat.S_ISREG(before.st_mode) and before.st_nlink == 1 and before.st_uid == os.getuid()
              target = os.open(output.name, os.O_WRONLY | os.O_APPEND | os.O_NOFOLLOW, dir_fd=fd)
              try:
                  assert attrs(before) == attrs(os.fstat(target))
                  raw = ('export=' + str(export) + '\n').encode()
                  assert os.write(target, raw) == len(raw)
              finally:
                  os.close(target)
          finally:
              os.close(fd)
          PY
          handoff_status=$?
          set -e
          if [ "$operator_status" -ne 0 ]; then exit "$operator_status"; fi
          exit "$handoff_status"

      - name: Retain admitted qualification evidence
        if: ${{ always() && steps.qualify.outputs.export != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        timeout-minutes: 2
        with:
          name: dev786-linux-qualification-${{ github.run_id }}-1
          path: ${{ steps.qualify.outputs.export }}
          retention-days: 7
          overwrite: false
          if-no-files-found: error
          compression-level: 0
