name: Native materialization development preflight
on:
  push:
    branches: [codex/dev786-native-materialization-preflight]
    paths: [.github/workflows/native-materialization-preflight.yml]
permissions:
  contents: read
jobs:
  materialize:
    if: github.repository == 'nold-ai/.github' && github.event.deleted != true
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact auxiliary candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Write reviewed compressed bytes 1
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir "$RUNNER_TEMP/native-materialization-preflight"
          printf '%s' '' >> "$RUNNER_TEMP/native-materialization-preflight/transport.b64"
      - name: Write reviewed compressed bytes 2
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' '' >> "$RUNNER_TEMP/native-materialization-preflight/transport.b64"
      - name: Write reviewed compressed bytes 3
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' '' >> "$RUNNER_TEMP/native-materialization-preflight/transport.b64"
      - name: Prepare reviewed scratch instrument
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          /usr/bin/python3 -I -S - <<'PY_DECODE'
          from pathlib import Path
          import base64, hashlib, os, zlib
          root = Path(os.environ['RUNNER_TEMP']) / 'native-materialization-preflight'
          manifest = [('preflight.py', 68815, 'b5ac0b79f1477c0d1a871054eeebde6731dc4752c0e7a497438f71b5d67414b6'), ('fixtures/compare.json', 326, 'e49c731f723a5bfe5daae171806b3e37caad1f46902e37a27d7bb6800a0f8599'), ('fixtures/corrupt-input-envelope.json', 738, '873544e96ec37ac6b2557691048493a492557aaade29a6eab0eb2606a451eeb5'), ('fixtures/corrupt-requirements.in', 413, 'b909849caf501cb1343aecf0e80fc26bf997126a78d574c46881d5e54741b18b'), ('fixtures/index-envelope.json', 638, '50e7030d2509d0adeae22777643fcae3af4ce8656c65fc623fe46fc7ea9ef520'), ('fixtures/index.json', 347, '8bb0276e13664a5208a26451fd66a7e83620c445209b0d24a569daf78d78bc27'), ('fixtures/main.json', 101, '2e6ee0a8cf7619f4dbe5624eb4814d59df4a701158d64c8af177c426e30b71db'), ('fixtures/moved-main.json', 101, '9187f2fd6a58682fcd4965fefc100865e6d7b8f5155034d382a24b478e8d664e'), ('fixtures/wrong-index-envelope.json', 638, '29ef78589ab54e3eba309f464d21d5051d0041eb93a1a05fda292d43034805b5'), ('fixtures/wrong-index.json', 347, 'cd491ae49ee174fc79d4eed775b22c03156d2d39ad147769da3a5afbed171359')]
          expected_names = ['preflight.py', 'fixtures/compare.json', 'fixtures/corrupt-input-envelope.json', 'fixtures/corrupt-requirements.in', 'fixtures/index-envelope.json', 'fixtures/index.json', 'fixtures/main.json', 'fixtures/moved-main.json', 'fixtures/wrong-index-envelope.json', 'fixtures/wrong-index.json']
          assert len(manifest) == 10 and [entry[0] for entry in manifest] == expected_names
          assert len(set(expected_names)) == 10
          assert expected_names[0] == 'preflight.py'
          assert all(name.startswith('fixtures/') and len(Path(name).parts) == 2
                     and Path(name).name not in {'.', '..'} for name in expected_names[1:])
          transport = root / 'transport.b64'
          assert transport.stat().st_size == 25728
          with transport.open('rb') as stream:
              transport_bytes = stream.read(25729)
          assert len(transport_bytes) == 25728
          compressed = base64.b64decode(transport_bytes, validate=True)
          assert len(compressed) == 19296
          assert hashlib.sha256(compressed).hexdigest() == 'c16a29dc4606cb847b67ad945275b584719ec8998a88bedc6d9c8124c63d9f70'
          total = sum(size for _, size, _ in manifest)
          assert total == 72464 and total <= 256 * 1024
          decoder = zlib.decompressobj()
          raw = decoder.decompress(compressed, total + 1)
          assert len(raw) == total and decoder.eof and not decoder.unused_data and not decoder.unconsumed_tail
          decoded, offset = {}, 0
          for name, size, digest in manifest:
              data = raw[offset:offset + size]
              assert len(data) == size and hashlib.sha256(data).hexdigest() == digest
              decoded[name] = data
              offset += size
          assert offset == total and list(decoded) == expected_names
          (root / 'fixtures').mkdir(mode=0o700)
          for name, data in decoded.items():
              with (root / name).open('xb') as stream:
                  stream.write(data)
          for name, size, digest in manifest:
              data = (root / name).read_bytes()
              assert len(data) == size and hashlib.sha256(data).hexdigest() == digest
          assert sorted(p.name for p in (root / 'fixtures').iterdir()) == sorted(Path(name).name for name in expected_names[1:])
          transport.unlink()
          PY_DECODE
      - name: Observe benign creation deadline
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -S "$RUNNER_TEMP/native-materialization-preflight/preflight.py" creation-control --policy "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/native-materialization-preflight/evidence"
      - name: Observe benign cleanup and original command controls
        id: controls
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -S "$RUNNER_TEMP/native-materialization-preflight/preflight.py" controls --policy "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/native-materialization-preflight/evidence"
      - name: Observe one unchanged native materialization
        if: success() && steps.controls.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -S "$RUNNER_TEMP/native-materialization-preflight/preflight.py" actual --policy "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/native-materialization-preflight/evidence"
      - name: Retain safe development diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-materialization-development-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-materialization-preflight/evidence/export/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
